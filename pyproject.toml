[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tzx-commander"
version = "0.6.0"
description = "Two-panel terminal manager for ZX Spectrum TAP and TZX images"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSES/GPL-3.0-or-later.txt"]
dependencies = [
    "tzxtools==1.9.5",
    "prompt-toolkit>=3.0.52,<4",
    "Pillow>=9.1",
]

[project.scripts]
tzx-commander = "tzx_commander.__main__:main"

[tool.setuptools.packages.find]
include = ["tzx_commander*"]

[tool.setuptools.data-files]
"share/tzx-commander/tools" = ["tools/scr.py", "tools/scr_viewer.py", "LICENSE"]
